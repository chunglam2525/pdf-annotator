<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PDF Annotator</title>
    <link rel="icon" href="data:," />
    <meta
      name="description"
      content="Annotate PDFs in the browser: draw, highlight, insert pages, then save."
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <svg xmlns="http://www.w3.org/2000/svg" class="icons" aria-hidden="true">
      <symbol id="icon-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 20h16a1 1 0 0 0 1-1V8.5a1 1 0 0 0-1-1h-6.2a1 1 0 0 1-.8-.4l-1.6-2.1a1 1 0 0 0-.8-.4H4a1 1 0 0 0-1 1V19a1 1 0 0 0 1 1z" />
      </symbol>
      <symbol id="icon-select" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 3v11l3.2-2.1L14 17.5l2.2-1.2-2.7-5.4L17 10.2 8 3z" />
      </symbol>
      <symbol id="icon-pencil" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 20h4l11.2-11.2a2 2 0 0 0 0-2.8L17 3.8a2 2 0 0 0-2.8 0L3 15v5h1z" />
        <path d="M13.5 5.5l5 5" />
      </symbol>
      <symbol id="icon-text" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 6h14M12 6v13M8 19h8" />
      </symbol>
      <symbol id="icon-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 12h14" />
        <path d="M14 6l6 6-6 6" />
      </symbol>
      <symbol id="icon-rect" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="5" y="6" width="14" height="12" rx="1.5" />
      </symbol>
      <symbol id="icon-highlight" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 18h7l9-9a2.1 2.1 0 0 0 0-3l-2-2a2.1 2.1 0 0 0-3 0l-9 9v5z" />
        <path d="M12 6l6 6" />
      </symbol>
      <symbol id="icon-image" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="5" width="16" height="14" rx="2" />
        <circle cx="9" cy="10" r="1.6" />
        <path d="M4 16l5-4 4 3 3-2 4 3" />
      </symbol>
      <symbol id="icon-undo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 8H4V4" />
        <path d="M4 8a8 8 0 1 1-1.2 4.5" />
      </symbol>
      <symbol id="icon-redo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M16 8h4V4" />
        <path d="M20 8a8 8 0 1 0 1.2 4.5" />
      </symbol>
      <symbol id="icon-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 8h14M10 4h4m-1 16h4a1 1 0 0 0 1-1V8H6v11a1 1 0 0 0 1 1h2z" />
      </symbol>
      <symbol id="icon-clear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 7h16M7 7l1 13h8l1-13M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2" />
      </symbol>
      <symbol id="icon-json" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 6c-2 0-3 1.5-3 6s1 6 3 6M16 6c2 0 3 1.5 3 6s-1 6-3 6" />
      </symbol>
      <symbol id="icon-save" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 4v10" />
        <path d="M8 10l4 4 4-4" />
        <path d="M5 18h14" />
      </symbol>
      <symbol id="icon-minus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <path d="M6 12h12" />
      </symbol>
      <symbol id="icon-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <path d="M12 6v12M6 12h12" />
      </symbol>
      <symbol id="icon-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <path d="M6 6l12 12M18 6L6 18" />
      </symbol>
    </svg>

    <header class="toolbar">
      <div class="brand">
        <strong>PDF Annotator</strong>
        <span id="doc-meta" class="meta">No document</span>
      </div>

      <div class="groups">
        <div class="group" role="group" aria-label="File">
          <button type="button" class="btn" id="open-btn" title="Open PDF">
            <svg><use href="#icon-open" /></svg>
            <span>Open</span>
          </button>
          <input id="file-input" type="file" accept="application/pdf,.pdf" hidden />
        </div>

        <div class="group" role="group" aria-label="Zoom">
          <button type="button" class="icon-btn" id="zoom-out" title="Zoom out" aria-label="Zoom out">
            <svg><use href="#icon-minus" /></svg>
          </button>
          <span id="zoom-label" class="zoom-label">100%</span>
          <button type="button" class="icon-btn" id="zoom-in" title="Zoom in" aria-label="Zoom in">
            <svg><use href="#icon-plus" /></svg>
          </button>
        </div>

        <div class="group tools" role="group" aria-label="Tools">
          <button type="button" class="icon-btn active" data-tool="select" title="Select (Esc)" aria-label="Select">
            <svg><use href="#icon-select" /></svg>
          </button>
          <button type="button" class="icon-btn" data-tool="pencil" title="Pencil" aria-label="Pencil">
            <svg><use href="#icon-pencil" /></svg>
          </button>
          <button type="button" class="icon-btn" data-tool="text" title="Text" aria-label="Text">
            <svg><use href="#icon-text" /></svg>
          </button>
          <button type="button" class="icon-btn" data-tool="highlight" title="Highlight PDF text" aria-label="Highlight PDF text">
            <svg><use href="#icon-highlight" /></svg>
          </button>
          <button type="button" class="icon-btn" data-tool="arrow" title="Arrow" aria-label="Arrow">
            <svg><use href="#icon-arrow" /></svg>
          </button>
          <button type="button" class="icon-btn" data-tool="rect" title="Rectangle" aria-label="Rectangle">
            <svg><use href="#icon-rect" /></svg>
          </button>
          <button type="button" class="icon-btn" id="image-btn" title="Insert image" aria-label="Insert image">
            <svg><use href="#icon-image" /></svg>
          </button>
        </div>

        <div class="group style-group" role="group" aria-label="Style">
          <label class="color-field" title="Color">
            <input id="color-input" type="color" value="#212121" />
          </label>
          <label class="field" title="Opacity">
            <span>Opacity</span>
            <input id="opacity-input" type="range" min="0.1" max="1" step="0.1" value="1" />
          </label>
          <label class="field" title="Brush size">
            <span>Brush</span>
            <input id="brush-input" type="number" min="1" max="50" value="2" />
          </label>
          <label class="field" title="Font size">
            <span>Font</span>
            <select id="font-input">
              <option value="10">10</option>
              <option value="12">12</option>
              <option value="16" selected>16</option>
              <option value="18">18</option>
              <option value="24">24</option>
              <option value="32">32</option>
              <option value="48">48</option>
              <option value="64">64</option>
              <option value="72">72</option>
              <option value="108">108</option>
            </select>
          </label>
        </div>

        <div class="group" role="group" aria-label="History">
          <button type="button" class="icon-btn" id="undo-btn" title="Undo (Ctrl+Z)" aria-label="Undo">
            <svg><use href="#icon-undo" /></svg>
          </button>
          <button type="button" class="icon-btn" id="redo-btn" title="Redo (Ctrl+Y)" aria-label="Redo">
            <svg><use href="#icon-redo" /></svg>
          </button>
          <button type="button" class="icon-btn danger" id="delete-btn" title="Delete selected (Delete)" aria-label="Delete selected">
            <svg><use href="#icon-trash" /></svg>
          </button>
          <button type="button" class="icon-btn danger" id="clear-btn" title="Clear page" aria-label="Clear page">
            <svg><use href="#icon-clear" /></svg>
          </button>
        </div>

        <div class="group" role="group" aria-label="Export">
          <button type="button" class="btn" id="json-btn" title="View or edit annotation JSON">
            <svg><use href="#icon-json" /></svg>
            <span>JSON</span>
          </button>
          <button type="button" class="btn primary" id="save-btn" title="Save annotated PDF">
            <svg><use href="#icon-save" /></svg>
            <span>Save</span>
          </button>
        </div>
      </div>
    </header>

    <main class="viewer" id="viewer">
      <div id="empty-state" class="empty">
        <p>Open a PDF to start annotating, drop a file here.</p>
        <div class="empty-actions">
          <button type="button" class="btn primary" id="empty-open">Open PDF</button>
          <button type="button" class="btn" id="empty-blank">Blank page</button>
        </div>
      </div>
      <p id="error" class="error" hidden></p>
      <p id="loading" class="loading" hidden>Loading PDF…</p>
      <div id="pdf-container" class="pages" hidden></div>
    </main>

    <dialog id="json-dialog" class="dialog">
      <div class="dialog-head">
        <h2>Annotation JSON</h2>
        <div class="dialog-actions">
          <button type="button" class="btn" id="apply-json">Apply</button>
          <button type="button" class="btn" id="copy-json">Copy</button>
          <button type="button" class="icon-btn" id="close-json" aria-label="Close">
            <svg><use href="#icon-close" /></svg>
          </button>
        </div>
      </div>
      <label class="json-label" for="json-output">Edit JSON, then Apply. It is validated first; page count must match the open document.</label>
      <textarea id="json-output" class="json-output" spellcheck="false"></textarea>
      <p id="json-error" class="json-error" hidden></p>
    </dialog>

    <!-- Classic scripts only: ES modules and Web Workers are blocked on file://. -->
    <script src="lib/fabric.min.js"></script>
    <script src="lib/pdf-lib.min.js"></script>
    <script>
      // PDF.js 6 expects the Iterator global; older browsers do not provide it.
      if (typeof Iterator === "undefined") {
        window.Iterator = { prototype: {} };
      }
    </script>
    <script src="lib/pdf.worker.min.js"></script>
    <script src="lib/pdf.min.js"></script>
    <script src="annotation-json.js"></script>
    <script src="annotator.js"></script>
    <script src="app.js"></script>
  </body>
</html>
